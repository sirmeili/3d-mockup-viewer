name: Release

# Push a tag like v0.2.0 to publish a GitHub release with dist/ zipped, and deploy dist/ to GitHub Pages.
# Pages: set Settings > Pages > Source to "GitHub Actions" once.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:browser
      - name: Zip dist
        run: cd dist && zip -qr ../mockup-viewer-dist.zip .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mockup-viewer-dist.zip
          generate_release_notes: true

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
